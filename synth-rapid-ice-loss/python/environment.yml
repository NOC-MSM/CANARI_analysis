name: ensemble-stats

channels:
  - conda-forge

dependencies:
  # Core
  - python=3.12
  - pip

  # Runtime dependencies
  - numpy>=2.0
  - pandas>=2.2
  - scipy>=1.14
  - xarray
  - statsmodels
  - scikit-learn
  - matplotlib
  - cftime

  # Optional I/O support
  - netcdf4
  - h5netcdf
  - zarr
  - dask
  - bottleneck

  # Notebook environment
  - jupyterlab
  - notebook
  - ipykernel

  # Documentation
  - sphinx
  - myst-parser
  - sphinx-rtd-theme

  # Development and testing
  - pytest
  - pytest-cov
  - black
  - ruff
  - mypy

  # Packaging and release
  - python-build
  - twine

  # Analysis and plotting utilities
  - seaborn
  - plotly
  - nc-time-axis

  # Optional performance
  - numba

  - pip:
      - -e .
